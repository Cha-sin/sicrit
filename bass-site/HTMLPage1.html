<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>吉他贝斯即兴助手</title>
    <script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
    <style>
        :root {
            --bg: #12141a;
            --card: #1c2029;
            --line: #2c3240;
            --txt: #e8eaf0;
            --sub: #8b93a7;
            --red: #ff4d5a;
            --gold: #f5c04a
        }

        * {
            box-sizing: border-box
        }

        body, select, input, button, svg text {
            font-family: "SimSun","宋体","Songti SC","STSong",serif
        }

        body {
            margin: 0 auto;
            padding: 16px;
            max-width: 1300px;
            background: var(--bg);
            color: var(--txt)
        }

        h1 {
            font-size: 24px;
            margin: 4px 0 12px;
            background: linear-gradient(90deg,#ff4d5a,#f5c04a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px
        }

        .box {
            background: #15181f;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px
        }

        h2 {
            font-size: 15px;
            margin: 0 0 8px;
            color: var(--sub)
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px
        }

        select, input, button {
            font-size: 15px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--line);
            background: #262b37;
            color: var(--txt)
        }

            input[type=range] {
                padding: 0;
                vertical-align: middle;
                width: 140px
            }

        button {
            cursor: pointer
        }

        #mode {
            font-size: 18px;
            font-weight: 700;
            padding: 10px 16px;
            border-color: var(--gold)
        }

        .go {
            background: var(--red);
            border-color: var(--red);
            font-weight: 700
        }

        .ch.cur {
            background: var(--red);
            border-color: var(--red);
            font-weight: 700
        }

        #info {
            color: var(--gold)
        }

        #msg, #st {
            color: var(--red);
            font-weight: 400
        }

        .panel {
            display: grid;
            grid-template-columns: 1fr minmax(300px,440px);
            gap: 14px
        }

        @media(max-width:900px) {
            .panel {
                grid-template-columns: 1fr
            }
        }

        #grid {
            display: grid;
            gap: 3px;
            align-items: center
        }

            #grid b {
                font-size: 12px;
                color: var(--sub)
            }

        .c {
            height: 22px;
            border-radius: 4px;
            background: #262b37;
            cursor: pointer;
            text-align: center;
            line-height: 22px;
            font-size: 12px;
            color: #222
        }

            .c.bt {
                background: #333b4c
            }

            .c.on {
                background: var(--gold)
            }

            .c.now {
                outline: 2px solid #fff
            }

        label {
            font-size: 14px
        }
    </style>
</head>
<body>
    <h1>🎸 吉他贝斯即兴助手</h1>

    <div class="card"><div class="row" style="margin:0">乐器 <select id="mode"></select></div></div>

    <div class="card">
        <h2>节奏与音色 <span id="st"></span></h2>
        <div class="panel">
            <div>
                <div class="row">
                    <select id="rh"></select>
                    <select id="feel"></select>
                    <label>摇摆量 <input type="range" id="sw" min="0" max="100" value="50"></label>
                    <label>步数 <input type="number" id="len" min="4" max="32" style="width:64px"></label>
                </div>
                <div class="row">
                    <label><input type="checkbox" id="c-on" checked> 和弦</label>
                    <label><input type="checkbox" id="b-on" checked> 贝斯</label>
                    <label><input type="checkbox" id="d-on" checked> 鼓</label>
                    <label>和弦音量 <input type="range" id="vc" min="0" max="150" value="100"></label>
                    <label>贝斯音量 <input type="range" id="vb" min="0" max="150" value="100"></label>
                    <label>鼓音量 <input type="range" id="vd" min="0" max="150" value="100"></label>
                </div>
                <div class="row">
                    <label>和弦 <select id="tim"></select> <select id="tver"></select></label>
                </div>
                <div class="row">
                    <label>贝斯 <select id="bt"></select></label>
                    <label>鼓 <select id="kit"></select></label>
                </div>
                <h2>节奏图（点格子编辑）</h2>
                <div id="grid"></div>
            </div>
            <div>
                <div class="box">
                    <h2>伴奏 EQ（拖动圆点）</h2>
                    <select id="eqp" style="margin-bottom:6px"></select>
                    <svg id="eq" viewBox="0 0 420 170" style="width:100%;touch-action:none"></svg>
                </div>
                <div class="box">
                    <h2>伴奏混响</h2>
                    <div class="row"><select id="rvp"></select></div>
                    <div class="row"><label>混响量 <input type="range" id="rvw" min="0" max="100" value="0"></label></div>
                    <div class="row"><label>房间大小 <input type="range" id="rvs" min="3" max="30" value="12"></label></div>
                    <div class="row"><label>柔和度 <input type="range" id="rvd" min="0" max="100" value="50"></label></div>
                    <div class="row"><label>余音长度 <input type="range" id="tail" min="20" max="150" value="70"></label></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <button id="play" class="go">▶ 播放</button>
            <input id="bpm" type="number" value="90" min="40" max="240" style="width:72px"> BPM
            <select id="bars"><option value="1">每和弦 1 小节</option><option value="2">每和弦 2 小节</option><option value="4">每和弦 4 小节</option></select>
            <label>调 <select id="key"></select></label>
            <select id="pre"></select>
        </div>
        <div class="row"><input id="inp" placeholder="手动输入：Am F C G 或 1645" style="min-width:220px"><button id="ok">应用</button><span id="msg"></span></div>
        <div id="chs" class="row"></div>
        <div id="info"></div>
    </div>

    <div class="card"><h2>指板 1 · <span id="nm1"></span></h2><select id="sc1"></select><div id="bd1"></div></div>
    <div class="card"><h2>指板 2 · <span id="nm2"></span></h2><select id="sc2"></select><div id="bd2"></div></div>

    <script>
        const $ = id => document.getElementById(id);
        const N = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        const SC = {
            "大调音阶": [0, 2, 4, 5, 7, 9, 11], "自然小调": [0, 2, 3, 5, 7, 8, 10], "混合利底亚": [0, 2, 4, 5, 7, 9, 10],
            "大调五声": [0, 2, 4, 7, 9], "小调五声": [0, 3, 5, 7, 10], "布鲁斯音阶": [0, 3, 5, 6, 7, 10]
        };
        const INST = {
            "吉他": { s: [4, 11, 7, 2, 9, 4], w: [1, 1.4, 1.8, 2.4, 3, 3.6], ring: false },
            "贝斯": { s: [7, 2, 9, 4], w: [2.2, 3, 3.8, 4.6], ring: true }
        };
        const PRE = [
            { n: "流行 1-5-6-4", c: [[0, ""], [7, ""], [9, "m"], [5, ""]] },
            { n: "流行 1-6-4-5", c: [[0, ""], [9, "m"], [5, ""], [7, ""]] },
            { n: "小调 i-VI-III-VII", c: [[0, "m"], [8, ""], [3, ""], [10, ""]] },
            { n: "爵士 2-5-1", c: [[2, "m7"], [7, "7"], [0, "maj7"]] },
            { n: "12 小节布鲁斯", c: [[0, "7"], [0, "7"], [0, "7"], [0, "7"], [5, "7"], [5, "7"], [0, "7"], [0, "7"], [7, "7"], [5, "7"], [0, "7"], [7, "7"]] }
        ];
        const FEEL = { "直拍": [0, 0], "轻摇摆": [8, .32], "Swing": [8, .48], "Shuffle": [8, .67], "十六分摇摆": [16, .33], "自定义": [8, 0] };

        // [默认律动, 和弦, 贝斯, 底鼓, 军鼓, 踩镲, (可选)镲片音高：42闭镲 51叮叮镲]
        const RH = {
            "Pop 摇滚 4/4": ["直拍", "X...x.x...x.x.x.", "1.......1.1.....", "x.......x.x.....", "....x.......x...", "x.x.x.x.x.x.x.x."],
            "Swing 爵士": ["Swing", "x.....x.........", "1...3...5...6...", "x...............", "................", "x...x.x.x...x.x.", 51],
            "Shuffle 蓝调": ["Shuffle", "X.x.X.x.X.x.X.x.", "1.3.5.6.7.6.5.3.", "x.......x.......", "....x.......x...", "x.x.x.x.x.x.x.x."],
            "Funk 十六分": ["直拍", "X.mx.xm.X.mx.xm.", "1..1..8...1.7...", "x.....x...x.....", "....x.......x...", "xxxxxxxxxxxxxxxx"],
            "Reggae 反拍": ["直拍", "..m...m...m...m.", "1.....1...5.1...", "........x.......", "........x.......", "x.x.x.x.x.x.x.x."],
            "Bossa Nova": ["直拍", "x..x..x...x..x..", "1.....5.1.....5.", "x.....x.x.....x.", "x..x..x...x..x..", "x.x.x.x.x.x.x.x."],
            "6/8 抒情": ["直拍", "X.x.x.X.x.x.", "1.....5.....", "x...........", "......x.....", "x.x.x.x.x.x."],
            "3/4 圆舞曲": ["直拍", "....x...x...", "1...........", "x...........", "............", "x...x...x..."],
            "5/4 (3+2)": ["直拍", "X...x...x...X...x...", "1.......1...5.......", "x...........x.......", "........x...........", "x.x.x.x.x.x.x.x.x.x."],
            "7/8 (2+2+3)": ["直拍", "X.x.X.x.X.x.x.", "1.......5.....", "x.......x.....", "....x.....x...", "x.x.x.x.x.x.x."],
            "四套六 4:6": ["直拍", "x..x..x..x..", "1.1.1.1.1.1.", "x...........", "............", "x.x.x.x.x.x."],
            "三套四 3:4": ["直拍", "x...x...x...", "1..1..1..1..", "x...........", "............", "x.x.x.x.x.x."]
        };

        // ---------- 音色 ----------
        const TB = {
            "复古清音电吉他": { p: "027", len: 1.3, vol: .28, ok: [["aspirin", 0], ["gibson"], ["fluidr3"], ["general"]] },
            "爵士电吉他": { p: "026", len: 1.3, vol: .28, ok: [["aspirin", 0], ["fluidr3"], ["jclive"]] },
            "闷音电吉他": { p: "028", len: .5, vol: .3, ok: [["aspirin", 0], ["chaos", 0], ["fluidr3", 0], ["fluidr3", 1]] },
            "过载电吉他": { p: "029", len: .9, vol: .25, pw: 1, ok: [["aspirin", 0], ["fluidr3", 0], ["fluidr3", 1], ["general", 0]] },
            "复古电钢琴": { p: "004", len: 1.3, vol: .3, up: 12 },
            "电钢琴 2": { p: "005", len: 1.3, vol: .3, up: 12 },
            "管风琴": { p: "016", len: 1.2, vol: .25, up: 12 },
            "钢弦木吉他": { p: "025", len: 1.3, vol: .3, ok: [["acoustic", 3]] },
            "合成 Pad": { p: "089", len: .8, vol: .2, up: 12 }
        };
        const BT = {
            "指弹电贝斯": { p: "033", pick: ["aspirin", 0], len: .6, vol: .55 },
            "拨片电贝斯": { p: "034", pick: ["fluidr3", 0], len: .5, vol: .55 },
            "原声贝斯": { p: "032", pick: ["fluidr3", 0], len: .7, vol: .6 }
        };
        const XK = {
            "太鼓": { k: ["116", 38], s: ["116", 50], h: ["115", 84] },
            "电子鼓": { k: ["118", 36], s: ["118", 52], h: ["118", 78] }
        };
        const HK = { "手鼓·邦戈铃鼓": { keys: [61, 60, 54] } };

        // ---------- 指板 ----------
        const FR = 22, NUT = 40, LEN = 1150, SPAN = LEN / (1 - 2 ** (-FR / 12));
        const fx = n => NUT + SPAN * (1 - 2 ** (-n / 12));

        function board(box, I, key, sc, ch) {
            const g = 30, t = 24, b = t + (I.s.length - 1) * g, L = fx(FR), W = L + 20, H = b + 40, mid = (t + b) / 2;
            let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block"><defs><linearGradient id="wd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4d2c"/><stop offset="1" stop-color="#4a2c18"/></linearGradient></defs>`;
            s += `<rect x="${NUT}" y="${t - 16}" width="${L - NUT}" height="${b - t + 32}" rx="4" fill="url(#wd)"/>`;
            for (const n of [3, 5, 7, 9, 12, 15, 17, 19, 21]) {
                const c = (fx(n - 1) + fx(n)) / 2;
                (n == 12 ? [mid - g, mid + g] : [mid]).forEach(y => s += `<circle cx="${c}" cy="${y}" r="5" fill="#e9dcc0" opacity=".35"/>`);
                s += `<text x="${c}" y="${b + 32}" text-anchor="middle" font-size="12" fill="#8b93a7">${n}</text>`;
            }
            s += `<rect x="${NUT - 5}" y="${t - 16}" width="6" height="${b - t + 32}" fill="#f1ead8"/>`;
            for (let n = 1; n <= FR; n++) s += `<line x1="${fx(n)}" y1="${t - 16}" x2="${fx(n)}" y2="${b + 16}" stroke="#c9ccd3" stroke-width="2.5"/>`;
            I.s.forEach((o, i) => {
                const y = t + i * g;
                s += `<line x1="${NUT - 28}" y1="${y}" x2="${L}" y2="${y}" stroke="${I.w[i] > 2.5 ? '#d8b878' : '#e8e8e8'}" stroke-width="${I.w[i]}"/>`;
                for (let f = 0; f <= FR; f++) {
                    const p = (o + f) % 12, inS = sc.includes((p - key + 12) % 12), inC = ch.pcs.includes(p);
                    if (!inS && !inC) continue;
                    const x = f ? (fx(f - 1) + fx(f)) / 2 : NUT - 22;
                    let fill = "#f4f4f4", tc = "#222", ring = "";
                    if (inC && !inS) { fill = "#ff4d5a"; tc = "#fff"; }
                    else if (inC) ring = ' stroke="#ff4d5a" stroke-width="2.5" stroke-dasharray="3 2"';
                    if (I.ring && p == ch.root) ring = ' stroke="#f5c04a" stroke-width="3"';
                    s += `<circle cx="${x}" cy="${y}" r="10" fill="${fill}"${ring}/>`;
                    s += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${tc}">${N[p]}</text>`;
                }
            });
            box.innerHTML = s + "</svg>";
        }

        // ---------- 和弦解析（字母 + 数字）----------
        function parse(t) {
            const m = t.match(/^([A-Ga-g])([#b]?)(.*)$/); if (!m) return null;
            const root = (N.indexOf(m[1].toUpperCase()) + (m[2] == "#" ? 1 : m[2] == "b" ? -1 : 0) + 12) % 12, r = m[3];
            const iv = /^(maj|M)7/.test(r) ? [0, 4, 7, 11] : /^(maj|M)/.test(r) ? [0, 4, 7] : /^m7/.test(r) ? [0, 3, 7, 10]
                : /^dim/.test(r) ? [0, 3, 6] : /^m/.test(r) ? [0, 3, 7] : /^7/.test(r) ? [0, 4, 7, 10] : [0, 4, 7];
            return { name: t, root, iv, pcs: iv.map(i => (root + i) % 12) };
        }
        const DEG = [0, 2, 4, 5, 7, 9, 11], DQ = ["", "m", "m", "", "", "m", "dim"];
        function num(a, d, suf, key) {
            const off = DEG[d - 1] + (a == "#" ? 1 : a == "b" ? -1 : 0);
            return N[(key + off + 12) % 12] + (suf == "d" ? "7" : suf ?? (a ? "" : DQ[d - 1]));
        }
        function expand(tokens, key) {
            const out = [];
            for (const t of tokens) {
                if (/^[1-7]+$/.test(t)) { for (const d of t) out.push(num("", d, undefined, key)); continue; }
                const m = t.match(/^([b#]?)([1-7])(maj7|m7|m|dim|d|7)?$/);
                out.push(m ? num(m[1], m[2], m[3], key) : t);
            }
            return out;
        }

        // ---------- 状态 ----------
        let chords = [], cur = 0, playing = false, tm, step = 0, nxt = 0, start = 0, hatKey = 42;
        let pat = { c: [], b: [], k: [], s: [], h: [] };

        function renderCh() {
            $("chs").innerHTML = "";
            chords.forEach((c, i) => {
                const b = document.createElement("button");
                b.textContent = c.name; b.className = "ch" + (i == cur ? " cur" : "");
                b.onclick = () => { cur = i; renderCh(); draw(); };
                $("chs").appendChild(b);
            });
        }
        function draw() {
            const ch = chords[cur]; if (!ch) return;
            const I = INST[$("mode").value], key = +$("key").value;
            $("info").textContent = `当前和弦 ${ch.name}　和弦内音：${ch.pcs.map(p => N[p]).join(" ")}`;
            [1, 2].forEach(n => {
                const sn = $("sc" + n).value;
                $("nm" + n).textContent = N[key] + " " + sn;
                board($("bd" + n), I, key, SC[sn], ch);
            });
        }
        function apply() {
            const key = +$("key").value;
            const tk = expand($("inp").value.split(/[\s,，、\-–—]+/).filter(x => x), key), ps = tk.map(parse), bad = ps.indexOf(null);
            if (!tk.length) { $("msg").textContent = "请输入和弦"; return; }
            if (bad != -1) { $("msg").textContent = "无法识别：" + tk[bad]; return; }
            $("msg").textContent = ""; chords = ps; cur = 0; renderCh(); draw();
        }
        function loadPre() {
            const v = $("pre").value; if (v === "") return apply();
            const k = +$("key").value;
            $("inp").value = PRE[v].c.map(x => N[(k + x[0]) % 12] + x[1]).join(" ");
            apply();
        }

        // ---------- 节奏与节奏图（可编辑）----------
        const CY = { c: [".", "x", "X", "m"], b: [".", "1", "3", "5", "6", "7", "8", "4"], k: [".", "x"], s: [".", "x"], h: [".", "x"] };
        function setRh(name) {
            const [fl, ...r] = RH[name], keys = ["c", "b", "k", "s", "h"];
            keys.forEach((x, i) => pat[x] = [...r[i]]);
            hatKey = r[5] || 42;
            const L = Math.max(...keys.map(x => pat[x].length));
            keys.forEach(x => { while (pat[x].length < L) pat[x].push("."); });
            $("feel").value = fl; $("rh").value = name; grid();
        }
        function grid() {
            const L = pat.c.length, rows = [["c", "和弦"], ["b", "贝斯"], ["k", "底鼓"], ["s", "军鼓"], ["h", "踩镲"]];
            $("len").value = L;
            $("grid").style.gridTemplateColumns = `44px repeat(${L},1fr)`;
            $("grid").innerHTML = rows.map(([r, nm]) => `<b>${nm}</b>` +
                pat[r].map((v, i) => `<div class="c${v != "." ? " on" : ""}${i % 4 == 0 ? " bt" : ""}" data-r="${r}" data-i="${i}">${v != "." ? v : ""}</div>`).join("")).join("");
        }
        function mark(k) { document.querySelectorAll("#grid .c").forEach(e => e.classList.toggle("now", +e.dataset.i == k)); }

        // ---------- EQ 曲线 ----------
        const EQF = [60, 150, 400, 1000, 2500, 6000, 12000];
        const EQP = {
            "平直": [0, 0, 0, 0, 0, 0, 0], "去浑浊": [-2, -3, -5, 0, 3, 3, 1], "明亮清晰": [-3, -2, -3, 0, 3, 5, 4], "温暖": [3, 3, 1, 0, -1, -3, -4],
            "重低音": [6, 4, 1, 0, 0, -1, -1], "复古电话": [-12, -9, 0, 5, 4, -5, -12], "爵士柔和": [1, 2, 0, -1, -2, -3, -5]
        };
        let eqG = [...EQP["去浑浊"]], eqF = [], drag = null;
        const EW = 420, EH = 170, ex = f => 34 + Math.log10(f / 20) / 3 * (EW - 44), ey = g => 10 + (12 - g) / 24 * (EH - 34);
        function drawEQ() {
            let s = `<rect width="${EW}" height="${EH}" rx="8" fill="#15181f"/>`;
            [-12, -6, 0, 6, 12].forEach(g => s += `<line x1="34" x2="${EW - 10}" y1="${ey(g)}" y2="${ey(g)}" stroke="${g ? '#2c3240' : '#666'}"/><text x="4" y="${ey(g) + 4}" font-size="10" fill="#8b93a7">${g}</text>`);
            [[100, "100"], [1000, "1k"], [10000, "10k"]].forEach(([f, l]) => s += `<line x1="${ex(f)}" x2="${ex(f)}" y1="10" y2="${EH - 24}" stroke="#2c3240"/><text x="${ex(f)}" y="${EH - 8}" font-size="10" text-anchor="middle" fill="#8b93a7">${l}</text>`);
            const fa = Float32Array.from({ length: 81 }, (_, i) => 20 * 1000 ** (i / 80)), db = new Float32Array(81), mg = new Float32Array(81), ph = new Float32Array(81);
            eqF.forEach(n => { n.getFrequencyResponse(fa, mg, ph); mg.forEach((m, i) => db[i] += 20 * Math.log10(m)); });
            s += `<polyline fill="none" stroke="#ff4d5a" stroke-width="2.5" points="${Array.from(fa, (f, i) => ex(f) + "," + ey(Math.max(-12, Math.min(12, db[i])))).join(" ")}"/>`;
            EQF.forEach((f, i) => s += `<circle cx="${ex(f)}" cy="${ey(eqG[i])}" r="7" fill="#f5c04a" stroke="#fff" stroke-width="1.5"/>`);
            $("eq").innerHTML = s;
        }
        function applyEQ() { eqF.forEach((n, i) => n.gain.value = eqG[i]); drawEQ(); }
        function eqPt(e) { const r = $("eq").getBoundingClientRect(); return [(e.clientX - r.left) / r.width * EW, (e.clientY - r.top) / r.height * EH]; }
        function moveEQ(e) {
            const y = eqPt(e)[1];
            eqG[drag] = Math.round(Math.max(-12, Math.min(12, 12 - (y - 10) / (EH - 34) * 24)) * 2) / 2;
            $("eqp").value = "自定义"; applyEQ();
        }

        // ---------- 混响 ----------
        const RVP = { "干声": [0, 3, 50], "小房间": [15, 6, 60], "舞台": [25, 12, 50], "大厅": [35, 25, 40] };
        let conv, wet, dbus, dlow, dmid, dlp, dcomp, dout, dsend, dstyle = "plain";
        function makeIR() {
            const sr = ctx.sampleRate, L = Math.floor(sr * $("rvs").value / 10), d = +$("rvd").value / 100, ir = ctx.createBuffer(2, L, sr);
            for (let c = 0; c < 2; c++) { const x = ir.getChannelData(c); let y = 0; for (let i = 0; i < L; i++) { y += (Math.random() * 2 - 1 - y) * (1 - d * .92); x[i] = y * (1 - i / L) ** 3; } }
            conv.buffer = ir;
        }

        // ---------- 真实采样音色库（WebAudioFont）----------
        let player, ctx, master, CAT = [], DRUMS = {}, cfg = { c: null, b: null, d: {} }, ready = false;
        const loaded = {}, PREF = ["fluidr3", "general", "aspirin", "gibson", "acoustic"];

        function initAudio() {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            master = ctx.createGain(); master.gain.value = .9;
            const T = ["lowshelf", "peaking", "peaking", "peaking", "peaking", "peaking", "highshelf"];
            eqF = EQF.map((f, i) => { const n = ctx.createBiquadFilter(); n.type = T[i]; n.frequency.value = f; n.Q.value = 1.1; n.gain.value = eqG[i]; return n; });
            master.connect(eqF[0]); eqF.forEach((n, i) => i && eqF[i - 1].connect(n));
            const last = eqF[6], comp = ctx.createDynamicsCompressor();
            last.connect(comp); comp.connect(ctx.destination);
            conv = ctx.createConvolver(); wet = ctx.createGain(); last.connect(wet); wet.connect(conv); conv.connect(comp);
            makeIR(); wet.gain.value = $("rvw").value / 100;
            // 鼓组专用效果器链：低频、中频、低通、压缩、房间感，用来做出不同的鼓组风格
            const bq = (ty, f) => { const n = ctx.createBiquadFilter(); n.type = ty; n.frequency.value = f; return n; };
            dbus = ctx.createGain(); dlow = bq("lowshelf", 120); dmid = bq("peaking", 3500); dlp = bq("lowpass", 20000);
            dcomp = ctx.createDynamicsCompressor(); dout = ctx.createGain(); dsend = ctx.createGain();
            dbus.connect(dlow); dlow.connect(dmid); dmid.connect(dlp); dlp.connect(dcomp); dcomp.connect(dout); dout.connect(master);
            dcomp.connect(dsend); dsend.connect(conv);
            player = new WebAudioFontPlayer();
            const L = player.loader;
            for (let i = 0; i < L.instrumentKeys().length; i++) CAT.push(L.instrumentInfo(i));
            for (let i = 0; i < L.drumKeys().length; i++) {
                const info = L.drumInfo(i), m = info.variable.match(/^_drum_(\d+)_(\d+)_(.+)_sf2_file$/);
                if (m) { const id = m[3] + " " + m[2]; (DRUMS[id] = DRUMS[id] || {})[m[1]] = info; }
            }
        }
        const match = (c, [f, v]) => c.variable.slice(11).toLowerCase().startsWith(f) && (v == null || +c.variable[9] == v);
        function cands(prog, ok) {
            const a = []; CAT.forEach((c, i) => { if (c && c.variable.slice(6, 9) == prog && (!ok || ok.some(o => match(c, o)))) a.push(i); });
            return a.length || !ok ? a : cands(prog);
        }
        const rk = i => { const r = PREF.findIndex(p => CAT[i].variable.slice(11).toLowerCase().startsWith(p)); return r < 0 ? 50 : r; };
        const best = a => a.reduce((m, i) => rk(i) < rk(m) ? i : m, a[0]);
        function fillVer(id, prog, ok) {
            const el = $(id), a = cands(prog, ok); el.innerHTML = "";
            a.forEach(i => el.add(new Option("版本：" + CAT[i].variable.slice(11).replace(/_sf2.*/, "") + " " + CAT[i].variable[9], i)));
            if (a.length) el.value = best(a); else el.add(new Option("（无可用音源）", -1));
        }
        function kitLanes(v) {
            const ty = v[0], name = v.slice(2);
            if (ty == "x") { const f = r => ({ i: CAT[best(cands(XK[name][r][0]))], p: XK[name][r][1] }); return { k: f("k"), s: f("s"), h: f("h") }; }
            const kit = DRUMS[ty == "h" ? HK[name].kit : name], ks = ty == "h" ? HK[name].keys : [36, 38, 42], f = key => ({ i: kit[key], p: +key });
            return { k: f(ks[0]), s: f(ks[1]), h: f(ks[2]), h2: kit[51] ? f(51) : f(ks[2]) };
        }
        // 鼓组风格 [低频dB, 中频dB, 低通Hz, 压缩阈值, 压缩比, 总音量, 房间混响, 底鼓力度, 军鼓力度, 镲片力度]
        const DS = {
            plain: [0, 0, 20000, 0, 1, 1, 0, .7, .55, .3],
            rock: [6, 3, 16000, -28, 8, 1.3, .25, 1, .9, .22],
            jazz: [1, -2, 5500, -18, 2, .8, .12, .3, .28, .2],
            punk: [2, 5, 20000, -24, 6, 1.2, .05, .9, 1, .3],
            vintage: [4, 1, 9000, -22, 4, 1.15, .4, .85, .8, .2],
            metal: [8, 4, 20000, -34, 10, 1.4, .08, 1, .9, .22]
        };
        function applyStyle() {
            const st = { r: "rock", j: "jazz", p: "punk", v: "vintage", m: "metal" }[$("kit").value[0]] || "plain", s = DS[st];
            dstyle = st; dlow.gain.value = s[0]; dmid.gain.value = s[1]; dlp.frequency.value = s[2];
            dcomp.threshold.value = s[3]; dcomp.ratio.value = s[4]; dcomp.attack.value = .003; dcomp.release.value = .12;
            dout.gain.value = s[5]; dsend.gain.value = s[6];
        }
        function refresh() {
            if (!player) return;
            applyStyle();
            $("st").textContent = "音色加载中…";
            const ti = CAT[$("tver").value], bt = BT[$("bt").value], bi = CAT[cands(bt.p, [bt.pick])[0]], lanes = kitLanes($("kit").value), items = [];
            if (ti) items.push([ti.url, ti.variable]);
            if (bi) items.push([bi.url, bi.variable]);
            Object.values(lanes).forEach(l => { if (l.i) items.push([l.i.url, l.i.variable]); });
            const finish = () => {
                cfg.c = ti && window[ti.variable]; cfg.b = bi && window[bi.variable]; cfg.d = {};
                for (const r in lanes) cfg.d[r] = lanes[r].i ? [window[lanes[r].i.variable], lanes[r].p] : null;
                ready = true; $("st").textContent = "";
            };
            let n = 0;
            items.forEach(([u, v]) => { if (!loaded[v]) { n++; player.loader.startLoad(ctx, u, v); } });
            if (!n) return finish();
            player.loader.waitLoad(() => { items.forEach(([, v]) => loaded[v] = 1); finish(); });
            setTimeout(() => { if ($("st").textContent) $("st").textContent = "加载较慢，请确认电脑已联网…"; }, 8000);
        }

        // ---------- 播放（每个"步"= 一个十六分音符）----------
        function play(s, t0) {
            const L = pat.c.length, per = L * +$("bars").value, ci = (start + Math.floor(s / per)) % chords.length;
            const k = (s % per) % L, ch = chords[ci], P = TB[$("tim").value], Bt = BT[$("bt").value], tl = $("tail").value / 100;
            const [sn, sa0] = FEEL[$("feel").value], sa = $("feel").value == "自定义" ? $("sw").value / 100 * .8 : sa0;
            const t = t0 + ((sn == 8 && k % 4 == 2) || (sn == 16 && k % 2 == 1) ? sa * 60 / bpm() / 4 : 0);
            const q = (pre, when, pitch, dur, vol) => player.queueWaveTable(ctx, master, pre, when, pitch, dur, vol);

            const hit = pat.c[k];
            if ($("c-on").checked && hit != "." && cfg.c) {
                const iv = P.pw ? [0, 7, 12] : ch.iv, base = 40 + (ch.root + 8) % 12 + (P.up || 0);
                const acc = hit == "X" ? 1.3 : hit == "m" ? .7 : 1, len = hit == "m" ? .12 : P.len * tl;
                iv.forEach((v, i) => q(cfg.c, t + i * .015, base + v, len, P.vol * acc * $("vc").value / 100));
            }
            const bh = pat.b[k];
            if ($("b-on").checked && bh != "." && cfg.b) {
                const iv = ch.iv, o = { x: 0, 1: 0, 3: iv[1], 5: iv[2], 6: 9, 7: iv[3] ?? 10, 8: 12, 4: 5 }[bh] ?? 0;
                q(cfg.b, t, 28 + (ch.root + 8) % 12 + o, Bt.len * tl, Bt.vol * $("vb").value / 100);
            }
            if ($("d-on").checked) {
                const D = cfg.d, r = .85 + Math.random() * .3, S = DS[dstyle];
                const dr = (lane, vol) => { const d = D[lane]; if (d && d[0]) player.queueWaveTable(ctx, dbus, d[0], t, d[1], 1, vol * $("vd").value / 100); };
                if (pat.k[k] != ".") dr("k", S[7] * r);
                if (pat.s[k] != ".") dr("s", S[8] * r);
                if (pat.h[k] != ".") dr((hatKey == 51 || dstyle == "jazz") && D.h2 ? "h2" : "h", S[9] * r * (k % 4 == 0 ? 1 : .7));
            }
            setTimeout(() => { if (!playing) return; if (cur != ci) { cur = ci; renderCh(); draw(); } mark(k); },
                Math.max(0, (t - ctx.currentTime) * 1000));
        }
        const bpm = () => Math.min(240, Math.max(40, +$("bpm").value || 90));
        function tick() { while (nxt < ctx.currentTime + .25) { play(step, nxt); nxt += 60 / bpm() / 4; step++; } }
        function toggle() {
            if (playing) { playing = false; clearInterval(tm); mark(-1); $("play").textContent = "▶ 播放"; return; }
            if (!chords.length || !player) return;
            if (!ready) { $("st").textContent = "音色还在加载，稍等几秒再点播放"; return; }
            ctx.resume(); playing = true; start = cur; step = 0; nxt = ctx.currentTime + .15;
            tick(); tm = setInterval(tick, 25); $("play").textContent = "■ 停止";
        }

        // ---------- 初始化 ----------
        for (const n in INST) $("mode").add(new Option(n, n));
        N.forEach((n, i) => $("key").add(new Option(n, i))); $("key").value = 9;
        $("pre").add(new Option("手动输入", "")); PRE.forEach((p, i) => $("pre").add(new Option(p.n, i)));
        [1, 2].forEach(n => { for (const s in SC) $("sc" + n).add(new Option(s, s)); });
        $("sc1").value = "大调五声"; $("sc2").value = "大调音阶";
        for (const r in RH) $("rh").add(new Option(r, r)); $("rh").add(new Option("自定义", "自定义"));
        for (const f in FEEL) $("feel").add(new Option("律动：" + f, f));
        for (const t in TB) $("tim").add(new Option(t, t));
        for (const t in BT) $("bt").add(new Option(t, t));
        for (const e in EQP) $("eqp").add(new Option("EQ：" + e, e)); $("eqp").add(new Option("EQ：自定义", "自定义")); $("eqp").value = "去浑浊";
        for (const r in RVP) $("rvp").add(new Option("混响：" + r, r)); $("rvp").add(new Option("混响：自定义", "自定义"));

        $("mode").onchange = draw; $("sc1").onchange = draw; $("sc2").onchange = draw;
        $("key").onchange = loadPre; $("pre").onchange = loadPre;
        $("inp").oninput = () => { $("pre").value = ""; };
        $("ok").onclick = apply; $("inp").onkeydown = e => { if (e.key == "Enter") apply(); };
        $("play").onclick = toggle;
        $("rh").onchange = () => { if ($("rh").value != "自定义") setRh($("rh").value); };
        $("sw").oninput = () => { $("feel").value = "自定义"; };
        $("grid").onclick = e => {
            const d = e.target.dataset; if (!d.r) return;
            const a = CY[d.r], v = pat[d.r][+d.i]; pat[d.r][+d.i] = a[(a.indexOf(v) + 1) % a.length];
            $("rh").value = "自定义"; grid();
        };
        $("len").onchange = () => {
            const L = Math.max(4, Math.min(32, +$("len").value || 16));
            for (const x in pat) { pat[x].length = L; for (let i = 0; i < L; i++) pat[x][i] = pat[x][i] || "."; }
            $("rh").value = "自定义"; grid();
        };

        if (window.WebAudioFontPlayer) {
            initAudio();
            // 鼓组：Chaos 4 和 JCLive 16，每个都有 6 种处理风格；再加打击乐类
            ["Chaos 4", "JCLive 16"].forEach(n => {
                if (!(DRUMS[n] && DRUMS[n][36] && DRUMS[n][38] && DRUMS[n][42])) return;
                [["g", "鼓组："], ["r", "摇滚套鼓（重）· "], ["j", "爵士套鼓（柔）· "], ["p", "朋克摇滚 · "], ["v", "复古70年代摇滚 · "], ["m", "重金属 · "]]
                    .forEach(([c, l]) => $("kit").add(new Option(l + n, c + ":" + n)));
            });
            for (const n in XK) $("kit").add(new Option("鼓组：" + n, "x:" + n));
            for (const n in HK) {
                const kit = Object.keys(DRUMS).sort().find(k => HK[n].keys.every(x => DRUMS[k][x]));
                if (kit) { HK[n].kit = kit; $("kit").add(new Option("鼓组：" + n, "h:" + n)); }
            }
            fillVer("tver", TB[$("tim").value].p, TB[$("tim").value].ok);
            $("tim").onchange = () => { fillVer("tver", TB[$("tim").value].p, TB[$("tim").value].ok); refresh(); };
            $("tver").onchange = $("bt").onchange = $("kit").onchange = refresh;

            const ev = $("eq");
            ev.onpointerdown = e => { const x = eqPt(e)[0]; let b = 0; EQF.forEach((f, i) => { if (Math.abs(ex(f) - x) < Math.abs(ex(EQF[b]) - x)) b = i; }); drag = b; ev.setPointerCapture(e.pointerId); moveEQ(e); };
            ev.onpointermove = e => { if (drag != null) moveEQ(e); };
            ev.onpointerup = () => { drag = null; };
            $("eqp").onchange = () => { if ($("eqp").value != "自定义") { eqG = [...EQP[$("eqp").value]]; applyEQ(); } };
            const rv = () => { wet.gain.value = $("rvw").value / 100; };
            $("rvw").oninput = () => { rv(); $("rvp").value = "自定义"; };
            $("rvs").onchange = $("rvd").onchange = () => { makeIR(); $("rvp").value = "自定义"; };
            $("rvp").onchange = () => { const p = RVP[$("rvp").value]; if (!p) return; $("rvw").value = p[0]; $("rvs").value = p[1]; $("rvd").value = p[2]; rv(); makeIR(); };
            applyEQ(); refresh();
        } else {
            $("st").textContent = "无法加载音色库，请确认电脑已联网，然后刷新页面";
        }

        setRh("Pop 摇滚 4/4");
        $("pre").value = "0"; loadPre();
    </script>
</body>
</html>
